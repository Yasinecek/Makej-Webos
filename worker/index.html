<script>
  const SUPABASE_URL = 'https://cxegfwfbgcgpwerfbvra.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_N_BIwMCTD6ZOTrtBl3juyw_CGIQ_lvh';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: true, storageKey: 'makej-auth' }
  });

  const gate = document.getElementById('auth-gate');
  const gateError = document.getElementById('gate-error');

  function showGate() { gate.classList.remove('hidden'); }
  function hideGate() { gate.classList.add('hidden'); }
  function showErr(msg) { gateError.textContent = msg; gateError.style.display = 'block'; }
  function clearErr() { gateError.style.display = 'none'; }

  function switchGateTab(tab) {
    document.getElementById('gate-login-form').style.display = tab === 'login' ? '' : 'none';
    document.getElementById('gate-register-form').style.display = tab === 'register' ? '' : 'none';
    document.getElementById('tab-login').classList.toggle('active', tab === 'login');
    document.getElementById('tab-register').classList.toggle('active', tab === 'register');
    clearErr();
  }

  function translateErr(msg) {
    if (msg.includes('Invalid login credentials')) return 'Nesprávný email nebo heslo.';
    if (msg.includes('Email not confirmed')) return 'Nejdřív potvrď svůj email.';
    if (msg.includes('User already registered') || msg.includes('already been registered')) return 'Tento email je již zaregistrovaný.';
    if (msg.includes('Password should be at least')) return 'Heslo musí mít alespoň 6 znaků.';
    return msg;
  }

  // Login
  document.getElementById('gate-submit').addEventListener('click', async () => {
    clearErr();
    const email = document.getElementById('gate-email').value.trim();
    const password = document.getElementById('gate-password').value;
    if (!email || !password) { showErr('Vyplň email a heslo.'); return; }
    const btn = document.getElementById('gate-submit');
    btn.disabled = true; btn.textContent = 'Přihlašuji...';
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) { showErr(translateErr(error.message)); btn.disabled = false; btn.textContent = 'Přihlásit se'; return; }
    const role = data.user?.user_metadata?.role;
    if (role === 'employer') {
      showErr('Tento účet je zaměstnavatelský. Pokračuj na dashboard.');
      btn.disabled = false; btn.textContent = 'Přihlásit se';
      setTimeout(() => { window.location.href = '../employer/'; }, 1500);
      return;
    }
    window.location.reload();
  });

  document.getElementById('gate-password').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('gate-submit').click(); });

  // Register
  document.getElementById('reg-submit').addEventListener('click', async () => {
    clearErr();
    const name = document.getElementById('reg-name').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const password = document.getElementById('reg-password').value;
    if (!name || !email || !password) { showErr('Vyplň všechna pole.'); return; }
    if (password.length < 6) { showErr('Heslo musí mít alespoň 6 znaků.'); return; }
    const btn = document.getElementById('reg-submit');
    btn.disabled = true; btn.textContent = 'Registruji...';
    const { error } = await sb.auth.signUp({ email, password, options: { data: { name, role: 'worker' } } });
    if (error) { showErr(translateErr(error.message)); btn.disabled = false; btn.textContent = 'Vytvořit účet brigádníka'; return; }
    showErr('');
    gateError.style.display = 'block';
    gateError.style.background = 'rgba(91,214,138,0.12)';
    gateError.style.borderColor = 'rgba(91,214,138,0.3)';
    gateError.style.color = '#5BD68A';
    gateError.textContent = 'Účet vytvořen! Zkontroluj email pro potvrzení, pak se přihlas.';
    btn.disabled = false; btn.textContent = 'Vytvořit účet brigádníka';
    switchGateTab('login');
  });

  // Check existing session
  sb.auth.getSession().then(({ data: { session } }) => {
    const role = session?.user?.user_metadata?.role;
    if (session && role !== 'employer') hideGate();
    else showGate();
  });
</script>

<script>
(function() {
  var peeker = document.getElementById('peeker');
  var eyeL   = document.getElementById('eyeL');
  var eyeR   = document.getElementById('eyeR');
  var pupilL = document.getElementById('pupilL');
  var pupilR = document.getElementById('pupilR');
  var browL  = document.getElementById('browL');
  var browR  = document.getElementById('browR');
  var lidL   = document.getElementById('lidL');
  var lidR   = document.getElementById('lidR');
  var eyeLs   = document.getElementById('eyeL-s');
  var eyeRs   = document.getElementById('eyeR-s');
  var pupilLs = document.getElementById('pupilL-s');
  var pupilRs = document.getElementById('pupilR-s');
  var lidLs   = document.getElementById('lidL-s');
  var lidRs   = document.getElementById('lidR-s');
  var isPwd      = false;
  var isEyeOpen  = false;
  var peekTimers = [];
  var blinkTimer = null;

  function setLidTransition(speed) {
    lidL.style.transition = 'height ' + speed + ' ease';
    lidR.style.transition = 'height ' + speed + ' ease';
  }

  function movePupil(pupilEl, eyeEl, mx, my, maxR) {
    var rect = eyeEl.getBoundingClientRect();
    var cx = rect.left + rect.width  / 2;
    var cy = rect.top  + rect.height / 2;
    var dx = mx - cx, dy = my - cy;
    var dist = Math.sqrt(dx * dx + dy * dy);
    var r = maxR || 4.5;
    var s = Math.min(dist, r) / Math.max(dist, 0.001);
    pupilEl.style.transform = 'translate(' + (dx * s).toFixed(2) + 'px,' + (dy * s).toFixed(2) + 'px)';
  }

  document.addEventListener('mousemove', function(e) {
    movePupil(pupilL,  eyeL,  e.clientX, e.clientY);
    movePupil(pupilR,  eyeR,  e.clientX, e.clientY);
    movePupil(pupilLs, eyeLs, e.clientX, e.clientY, 9);
    movePupil(pupilRs, eyeRs, e.clientX, e.clientY, 9);
  });

  // ── Normální mrknutí každých 5s ──────────────────────────────
  function scheduleBlink() {
    blinkTimer = setTimeout(function() {
      if (isPwd) return;
      setLidTransition('0.08s');
      lidL.style.height = '21px';
      lidR.style.height = '21px';
      lidLs.style.transition = 'height 0.08s ease';
      lidRs.style.transition = 'height 0.08s ease';
      lidLs.style.height = '42px';
      lidRs.style.height = '42px';
      setTimeout(function() {
        lidL.style.height = '0';
        lidR.style.height = '0';
        lidLs.style.height = '0';
        lidRs.style.height = '0';
        setTimeout(function() {
          setLidTransition('0.28s');
          lidLs.style.transition = 'height 0.28s ease';
          lidRs.style.transition = 'height 0.28s ease';
          scheduleBlink();
        }, 120);
      }, 100);
    }, 5000);
  }

  function stopBlink() { clearTimeout(blinkTimer); blinkTimer = null; }

  // ── Tajné koukání při hesle ───────────────────────────────────
  function clearPeekTimers() {
    peekTimers.forEach(clearTimeout);
    peekTimers = [];
  }

  function schedulePeek() {
    peekTimers.push(setTimeout(function() {
      lidR.style.height = '11px';
      isEyeOpen = true;
      peekTimers.push(setTimeout(function() {
        isEyeOpen = false;
        lidR.style.height = '21px';
        peekTimers.push(setTimeout(schedulePeek, 5000));
      }, 1000));
    }, 3000));
  }

  function peekAtPassword() {
    isPwd = true;
    stopBlink();
    clearPeekTimers();
    peeker.style.transform = 'translateY(-14px)';
    setLidTransition('0.28s');
    lidL.style.height = '21px';
    lidR.style.height = '21px';
    browL.style.transform = 'translateY(5px)';
    browR.style.transform = 'translateY(5px)';
    schedulePeek();
  }

  function stopPeeking() {
    isPwd = false;
    isEyeOpen = false;
    clearPeekTimers();
    peeker.style.transform = '';
    setLidTransition('0.28s');
    lidL.style.height = '0';
    lidR.style.height = '0';
    browL.style.transform = '';
    browR.style.transform = '';
    scheduleBlink();
  }

  ['gate-password', 'reg-password'].forEach(function(id) {
    var el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('focus', peekAtPassword);
    el.addEventListener('blur',  stopPeeking);
  });

  scheduleBlink(); // spustí normální mrkání hned od začátku
})();
</script>
