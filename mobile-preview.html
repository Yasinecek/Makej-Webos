<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Mobilní náhled – Makej</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 24px;
    font-family: sans-serif;
    min-height: 100vh;
  }
  .toolbar {
    display: flex; gap: 12px; margin-bottom: 20px; align-items: center;
  }
  .toolbar label { color: #8899bb; font-size: .82rem; font-weight: 600; }
  .toolbar button {
    padding: 7px 18px; border-radius: 8px; border: 1px solid #444;
    background: #2a2a3e; color: #fff; font-size: .82rem; font-weight: 700;
    cursor: pointer;
  }
  .toolbar button.active { background: #1e2d78; border-color: #4a5edc; }

  .phone-shell {
    background: #111;
    border-radius: 44px;
    padding: 14px 10px;
    box-shadow: 0 0 0 2px #333, 0 30px 80px rgba(0,0,0,.7);
    position: relative;
  }
  .phone-notch {
    width: 120px; height: 28px; background: #111;
    border-radius: 0 0 18px 18px;
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    z-index: 10;
  }
  .phone-screen {
    border-radius: 36px;
    overflow: hidden;
    position: relative;
  }
  iframe {
    display: block;
    border: none;
    width: 390px;
    height: 720px;
  }

  .size-label { color: #8899bb; font-size: .75rem; margin-top: 14px; }
</style>
</head>
<body>

<div class="toolbar">
  <label>Velikost:</label>
  <button class="active" onclick="setSize(390,720,this)">iPhone 14 (390px)</button>
  <button onclick="setSize(375,667,this)">iPhone SE (375px)</button>
  <button onclick="setSize(412,915,this)">Android (412px)</button>
</div>

<div class="phone-shell" id="shell">
  <div class="phone-notch"></div>
  <div class="phone-screen">
    <iframe id="preview" src="index.html" scrolling="yes"></iframe>
  </div>
</div>

<div class="size-label" id="size-label">390 × 720 px</div>

<script>
  function setSize(w, h, btn) {
    document.getElementById('preview').style.width  = w + 'px';
    document.getElementById('preview').style.height = h + 'px';
    document.getElementById('size-label').textContent = w + ' × ' + h + ' px';
    document.querySelectorAll('.toolbar button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }
</script>

</body>
</html>
