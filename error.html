<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jejda strejda — Makej+</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #05071a;
      --primary: #0020f6;
      --accent: #1a35ff;
      --secondary: #a0b4ff;
    }

    body {
      background: var(--bg);
      color: #fff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      overflow: hidden;
      position: relative;
    }

    /* Ambient glow blobs */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.18;
      pointer-events: none;
    }
    .blob-1 { width: 500px; height: 500px; background: var(--primary); top: -120px; left: -100px; }
    .blob-2 { width: 400px; height: 400px; background: #5500cc; bottom: -80px; right: -60px; }

    .error-wrap {
      position: relative;
      z-index: 1;
      max-width: 520px;
    }

    /* Big glitchy error code */
    .error-code {
      font-size: clamp(5rem, 20vw, 9rem);
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(90deg, var(--primary), #7b5cff, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
      animation: glitch 4s infinite;
    }

    @keyframes glitch {
      0%, 94%, 100% { transform: none; filter: none; }
      95% { transform: translateX(-3px); filter: hue-rotate(90deg); }
      96% { transform: translateX(3px); }
      97% { transform: translateX(-2px); filter: hue-rotate(-90deg); }
      98% { transform: none; filter: none; }
    }

    .emoji-big {
      font-size: 4rem;
      margin-bottom: 20px;
      display: block;
      animation: wobble 2.5s ease-in-out infinite;
    }

    @keyframes wobble {
      0%, 100% { transform: rotate(-5deg); }
      50% { transform: rotate(5deg); }
    }

    h1 {
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      font-weight: 900;
      margin-bottom: 16px;
      line-height: 1.2;
    }

    h1 span {
      background: linear-gradient(90deg, var(--secondary), #fff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    p {
      color: rgba(160, 180, 255, 0.8);
      font-size: 1.05rem;
      line-height: 1.7;
      margin-bottom: 36px;
    }

    .btn-home {
      display: inline-block;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      padding: 14px 32px;
      border-radius: 50px;
      text-decoration: none;
      transition: opacity .2s, transform .2s;
    }
    .btn-home:hover { opacity: .85; transform: translateY(-2px); }

  </style>
</head>
<body>

  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="error-wrap">
    <!-- Makač peeker - sad mode -->
    <div style="margin: 0 auto 28px; width: 88px; height: 76px; background: linear-gradient(160deg,#1a35ff 0%,#0020f6 100%); border-radius: 50% 50% 44% 44%; position: relative; box-shadow: inset 0 1px 0 rgba(255,255,255,0.18); border: 2px solid rgba(80,120,255,0.25);">
      <div style="position:absolute;left:13px;top:15px;width:18px;height:3px;background:rgba(190,190,255,0.7);border-radius:2px;transform:rotate(-12deg);"></div>
      <div style="position:absolute;right:13px;top:15px;width:18px;height:3px;background:rgba(190,190,255,0.7);border-radius:2px;transform:rotate(12deg);"></div>
      <div style="position:absolute;left:15px;top:28px;width:21px;height:21px;background:white;border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden;">
        <div style="width:11px;height:11px;background:#16163c;border-radius:50%;position:relative;">
          <div style="position:absolute;width:3px;height:3px;background:rgba(255,255,255,0.9);border-radius:50%;top:1px;right:1px;"></div>
        </div>
      </div>
      <div style="position:absolute;right:15px;top:28px;width:21px;height:21px;background:white;border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden;">
        <div style="width:11px;height:11px;background:#16163c;border-radius:50%;position:relative;">
          <div style="position:absolute;width:3px;height:3px;background:rgba(255,255,255,0.9);border-radius:50%;top:1px;right:1px;"></div>
        </div>
      </div>
      <div style="position:absolute;bottom:13px;left:50%;transform:translateX(-50%) scaleY(-1);width:22px;height:10px;border-top:3px solid rgba(255,255,255,0.5);border-radius:0 0 12px 12px;"></div>
      <div style="position:absolute;bottom:11px;left:7px;width:16px;height:8px;border-radius:50%;background:rgba(255,100,150,0.28);"></div>
      <div style="position:absolute;bottom:11px;right:7px;width:16px;height:8px;border-radius:50%;background:rgba(255,100,150,0.28);"></div>
    </div>

    <h1>Jejda strejda,<br><span>to se stát nemělo.</span></h1>
    <p>
      Omlouváme se, ale nastala chyba.<br>
      Už pracujeme na tom, aby vše fungovalo jak má.<br>
      Díky za pochopení&nbsp;🙏
    </p>
    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
      <a href="index.html" class="btn-home">← Zpět na hlavní stránku</a>
      <button onclick="window.location.reload()" class="btn-home" style="border:none;cursor:pointer;">Zkusit znovu</button>
    </div>
  </div>

</body>
</html>
